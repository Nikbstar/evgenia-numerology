<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#110b1c" />
  <meta name="description" content="Евгения — нумерология. Все социальные сети в одном месте." />
  <meta name="robots" content="index,follow" />

  <title>Евгения — нумерология</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="page">
    <section class="card" aria-label="Контакты Евгении">
      <div class="symbol" aria-hidden="true">
        <span class="number">7</span>
      </div>

      <p class="eyebrow">Нумерология</p>
      <h1>Евгения</h1>
      <p class="subtitle">Все мои социальные сети в одном месте</p>

      <nav class="links" aria-label="Социальные сети">

        <!-- Замените username на реальное имя пользователя -->
        <a class="social-link"
           href="https://t.me/username"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Открыть Telegram">

          <span class="social-icon">
            <img src="icons/telegram.svg" alt="" />
          </span>

          <span class="social-text">
            <span class="social-name">Telegram</span>
            <span class="social-handle">@username</span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a class="social-link"
           href="https://vk.com/username"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Открыть ВКонтакте">

          <span class="social-icon">
            <img src="icons/vk.svg" alt="" />
          </span>

          <span class="social-text">
            <span class="social-name">ВКонтакте</span>
            <span class="social-handle">@username</span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a class="social-link"
           href="https://www.instagram.com/username/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Открыть Instagram">

          <span class="social-icon">
            <img src="icons/instagram.svg" alt="" />
          </span>

          <span class="social-text">
            <span class="social-name">Instagram</span>
            <span class="social-handle">@username</span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a class="social-link"
           href="https://wa.me/79000000000"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Открыть WhatsApp">

          <span class="social-icon">
            <img src="icons/whatsapp.svg" alt="" />
          </span>

          <span class="social-text">
            <span class="social-name">WhatsApp</span>
            <span class="social-handle">Написать сообщение</span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

      </nav>

      <div class="footer-mark" aria-hidden="true">1 · 3 · 7 · 9</div>
    </section>
  </main>
</body>
</html>
